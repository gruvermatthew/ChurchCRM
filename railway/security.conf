# Hardening for the public Railway deployment.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/>
	Options -Indexes
</Directory>

# Schema and upgrade SQL are read from disk by the app, never over HTTP.
<Directory /var/www/html/mysql>
	Require all denied
</Directory>

# Railway's edge (100.64.0.0/10) terminates TLS. Use the client address it
# forwards so per-IP sign-in throttling counts each visitor, not the edge.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 100.64.0.0/10
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined

Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
Header always unset X-Powered-By
